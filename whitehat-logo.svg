<svg viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fond texturé subtil -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0a1410"/>
      <stop offset="100%" stop-color="#040604"/>
    </radialGradient>

    <!-- Glow vert pour le W -->
    <filter id="glowGreen" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur1"/>
      <feFlood flood-color="#39ff8f" flood-opacity="0.9"/>
      <feComposite in2="blur1" operator="in" result="glow1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur2"/>
      <feFlood flood-color="#39ff8f" flood-opacity="0.7"/>
      <feComposite in2="blur2" operator="in" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ombre rouge portée pour le S -->
    <filter id="glowRed" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feFlood flood-color="#ff2b2b" flood-opacity="0.85"/>
      <feComposite in2="blur1" operator="in" result="glow1"/>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dégradé vert du W (plus clair en haut) -->
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8dffc4"/>
      <stop offset="45%" stop-color="#3fe38a"/>
      <stop offset="100%" stop-color="#1f9d5e"/>
    </linearGradient>

    <!-- Dégradé rouge du S -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="55%" stop-color="#c81f1f"/>
      <stop offset="100%" stop-color="#7a0f0f"/>
    </linearGradient>

    <!-- Scanlines texture -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <rect width="4" height="1" fill="#000000" opacity="0.18"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="300" height="340" rx="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Fond -->
    <rect width="300" height="340" fill="url(#bgGrad)"/>

    <!-- W lumineux -->
    <text x="150" y="255" text-anchor="middle"
          font-family="Arial Black, Arial, sans-serif" font-weight="900"
          font-size="260" fill="url(#wGrad)" filter="url(#glowGreen)"
          letter-spacing="-6">W</text>

    <!-- S rouge en surimpression -->
    <text x="150" y="200" text-anchor="middle"
          font-family="Arial Black, Arial, sans-serif" font-weight="900"
          font-size="150" fill="url(#sGrad)" filter="url(#glowRed)"
          stroke="#3a0505" stroke-width="1">S</text>

    <!-- Texture scanlines par-dessus -->
    <rect width="300" height="340" fill="url(#scan)"/>

    <!-- Vignette légère pour resserrer le regard au centre -->
    <rect width="300" height="340" fill="url(#bgGrad)" opacity="0.15"/>
  </g>
</svg>
